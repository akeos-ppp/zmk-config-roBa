manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sayu-hub
      url-base: https://github.com/sayu-hub
    # - name: kumamuk-git
    #   url-base: https://github.com/kumamuk-git
    - name: sekigon-gonnoc  # <-- IQS7211E
      url-base: https://github.com/sekigon-gonnoc
    - name: zettaface  # <-- Input Processor Keybind
      url-base: https://github.com/zettaface
    - name: caksoylar  # <-- RGB LED
      url-base: https://github.com/caksoylar
    - name: prospector
      url-base: https://github.com/t-ogura

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.2.1
      import: app/west.yml
    # - name: zmk-pmw3610-driver
    #   remote: kumamuk-git
    #   revision: main
    - name: zmk-driver-iqs7211e
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-input-processor-keybind
      remote: zettaface
      revision: main
    - name: prospector-zmk-module
      remote: prospector
      revision: v1.1.1
      path: modules/prospector-zmk-module

  self:
    path: config
