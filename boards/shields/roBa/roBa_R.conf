# ========================================
# KEYBOARD IDENTIFICATION
# ========================================
CONFIG_ZMK_KEYBOARD_NAME="roBaish"

# ========================================
# HARDWARE CONFIGURATION
# ========================================
CONFIG_NFCT_PINS_AS_GPIOS=y

# ========================================
# BLUETOOTH
# ========================================
CONFIG_ZMK_BLE=y

# Improve BLE link stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ========================================
# POINTING DEVICE - PAW3222
# ========================================
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_PAW3222=y

# ========================================
# ROTARY ENCODER
# ========================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================
# SPLIT KEYBOARD - RIGHT SIDE CENTRAL
# ========================================
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# BLE connection interval settings (unit: 1.25ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Reduce first-key delay from the left half.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# ========================================
# ZMK STUDIO
# ========================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ========================================
# PROSPECTOR STATUS ADVERTISEMENT
# ========================================
CONFIG_ZMK_STATUS_ADVERTISEMENT=y

# ========================================
# DEBUGGING
# ========================================
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
