# ========================================
# KEYBOARD IDENTIFICATION
# ========================================
CONFIG_ZMK_KEYBOARD_NAME="roBaish"

# ========================================
# HARDWARE CONFIGURATION
# ========================================
# Use NFC pins as GPIO on nRF52 boards
CONFIG_NFCT_PINS_AS_GPIOS=y

# Bluetooth HID
CONFIG_ZMK_BLE=y

# ========================================
# POINTING DEVICE - IQS7211E TRACKPAD
# ========================================
CONFIG_ZMK_POINTING=y
CONFIG_IQS7211E=y

# IQS7211E uses I2C, not SPI.
# Do not enable CONFIG_SPI here when PAW3222 / PMW3610 is removed.

# Optional:
# Enable only if you use `scroller-mode;` in roBa_R.overlay.
# CONFIG_IQS7211E_SCROLLER_INERTIA=y
# CONFIG_IQS7211E_SCROLLER_INERTIA_DECAY_PERMILLE=920
# CONFIG_IQS7211E_SCROLLER_INERTIA_STOP_THRESHOLD_Q8=96

# Optional:
# Tap ignore edge margin. Default is 80.
# CONFIG_IQS7211E_TAP_EDGE_MARGIN_PERMILLE=80

# ========================================
# ROTARY ENCODER
# ========================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================
# SPLIT KEYBOARD - RIGHT SIDE CENTRAL
# ========================================
# roBa_R is the central side.
# CONFIG_ZMK_SPLIT and CONFIG_ZMK_SPLIT_ROLE_CENTRAL are already set
# in the shield Kconfig.defconfig, so they do not need to be repeated here.

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ========================================
# ZMK STUDIO
# ========================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ========================================
# PROSPECTOR SCANNER ADVERTISEMENT
# ========================================
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="roBaish"

# roBa is right-central.
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"

# Activity-based advertisement intervals
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y

# Active: 10Hz while typing / moving
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100

# Idle: once every 30 seconds
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000

# Switch to idle mode after 10 seconds
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=10000

# ========================================
# WPM TRACKING
# ========================================
# Optional. Default is 30 seconds.
# CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30

# ========================================
# DEBUGGING
# ========================================
# Enable only while debugging.
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
