# Bluetooth
CONFIG_ZMK_BLE=y

# SPI and Input
CONFIG_SPI=y
CONFIG_INPUT=y

# Rotary encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================
# MOUSE CONFIGURATION (PMW3610)
# ========================================
CONFIG_ZMK_MOUSE=y
CONFIG_PMW3610=y

# CPI settings
CONFIG_PMW3610_CPI=1000
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y

# Snipe mode (commented out)
# CONFIG_PMW3610_SNIPE_CPI=1000
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4

# Scroll settings
CONFIG_PMW3610_SCROLL_TICK=8

# Axis inversion
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=n
CONFIG_PMW3610_INVERT_SCROLL_X=n

# Power management
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n

# Polling and automation
CONFIG_PMW3610_POLLING_RATE_125_SW=y
#CONFIG_PMW3610_POLLING_RATE_250_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=600
CONFIG_PMW3610_MOVEMENT_THRESHOLD=2
CONFIG_PMW3610_SMART_ALGORITHM=y

# ========================================
# SPLIT KEYBOARD - RIGHT SIDE (CENTRAL)
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="roBaish"

# Right side is central (default - no need to specify side)

# ========================================
# POWER OPTIMIZATION (v1.1.1)
# ========================================
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y

# Active: 10Hz when typing
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100

# Idle: 0.03Hz when idle (30 seconds)
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000

# Switch to idle mode after 10 seconds
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=10000
