# ========================================
# KEYBOARD IDENTITY
# ========================================
CONFIG_ZMK_KEYBOARD_NAME="roBaish"

# ========================================
# HARDWARE CONFIGURATION
# ========================================
# NFC pins as GPIO (for nRF52 boards)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Bluetooth
CONFIG_ZMK_BLE=y

# SPI for trackball
CONFIG_SPI=y

# Input subsystem
CONFIG_INPUT=y

# Pointing device support
CONFIG_ZMK_POINTING=y


# ========================================
# PMW3610 TRACKBALL CONFIGURATION
# ========================================
CONFIG_PMW3610=y

# Basic settings
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y

# Scroll settings
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y

# Power management
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20

# Polling rate
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# Auto-mouse
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_MOVEMENT_THRESHOLD=2

# Optional: Snipe mode (commented out)
# CONFIG_PMW3610_SNIPE_CPI=800
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4

# Optional: Advanced power settings (commented out)
# CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
# CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
# CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
# CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
# CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
# CONFIG_PMW3610_FORCE_AWAKE=n

# ========================================
# ROTARY ENCODER (EC11)
# ========================================
# Note: Only enable if encoder is defined in devicetree
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================
# SPLIT KEYBOARD - BATTERY REPORTING
# ========================================
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ========================================
# PROSPECTOR SCANNER INTEGRATION
# ========================================
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="roBaish"

# Power optimization (v1.1.1)
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y

# Active: 10Hz when typing
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100

# Idle: 0.03Hz when idle (30 seconds)
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000

# Switch to idle mode after 10 seconds
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=10000

# Display customization (0-6 = 7 layers)
# Note: Only works when PROSPECTOR_MODE_SCANNER is enabled
# CONFIG_PROSPECTOR_MAX_LAYERS=7

# Optional: Stop advertisements in deep sleep (max battery save)
# CONFIG_ZMK_STATUS_ADV_STOP_ON_SLEEP=y

# WPM tracking (v1.1.1)
# Balanced: 30s window (default)
# CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30

# ========================================
# ZMK STUDIO
# ========================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ========================================
# DEBUGGING (Development Only - Comment out for production)
# ========================================
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
