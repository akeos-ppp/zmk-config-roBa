# ========================================
# HARDWARE CONFIGURATION
# ========================================
# NFC pins as GPIO (for nRF52 boards)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Rotary encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Rotary encoder resolution (higher = finer control)
CONFIG_EC11_EVENT_QUEUE_SIZE=16
CONFIG_INPUT_MSEC_POLL_PERIOD=8

# ========================================
# SPLIT KEYBOARD - LEFT SIDE (PERIPHERAL)
# ========================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ========================================
# PROSPECTOR SCANNER INTEGRATION
# ========================================
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="roBaish"

# ========================================
# POWER OPTIMIZATION (v1.1.1)
# ========================================
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=10000

# ========================================
# DISPLAY CUSTOMIZATION
# ========================================
CONFIG_PROSPECTOR_MAX_LAYERS=7

# ========================================
# WPM TRACKING (v1.1.1)
# ========================================
# CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30

# ========================================
# DEBUGGING (Development Only - Comment out for production)
# ========================================
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
