# ========================================
# HARDWARE CONFIGURATION
# ========================================
CONFIG_NFCT_PINS_AS_GPIOS=y

# ========================================
# BLUETOOTH / SPLIT
# ========================================
# Explicitly enable BLE for split transport.
CONFIG_ZMK_BLE=y

# Improve BLE link stability between halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ========================================
# ROTARY ENCODER
# ========================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ========================================
# POINTING / MOUSE BEHAVIOR SUPPORT
# ========================================
# Physical pointing device is on the right side,
# but the shared keymap may contain mouse behaviors.
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# ========================================
# PROSPECTOR STATUS ADVERTISEMENT
# ========================================
# Disabled temporarily for BLE latency diagnosis.
# CONFIG_ZMK_STATUS_ADVERTISEMENT is not set

# ========================================
# DEBUGGING
# ========================================
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
